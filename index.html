<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Grupo Termo Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #141927;
            --accent-primary: #00d4ff;
            --accent-secondary: #7c3aed;
            --text-primary: #e8edf4;
            --text-secondary: #9ca3af;
            --border-color: #2d3548;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Outfit', sans-serif; 
            background: var(--bg-primary); 
            color: var(--text-primary); 
            min-height: 100vh; 
            overflow: hidden; 
        }

        .gradient-text {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text; 
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        /* Login */
        .login-container { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 2rem; 
        }
        
        .login-box { 
            background: var(--bg-secondary); 
            border: 1px solid var(--border-color); 
            border-radius: 24px; 
            padding: 3rem; 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
        }
        
        .form-input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            background: #1e2535; 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            color: white; 
            outline: none;
        }

        .btn { 
            padding: 12px 24px; 
            border-radius: 10px; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s;
        }
        
        .btn-primary { 
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); 
            color: white; 
            width: 100%; 
        }

        .error-message { color: #ff4d4d; font-size: 0.9rem; margin-top: 10px; display: none; }
        .error-message.show { display: block; }

        /* Dashboard */
        .dashboard { display: none; padding: 2rem; max-width: 1200px; margin: 0 auto; }
        .dashboard.active { display: block; }
        
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 1.5rem; 
            margin-bottom: 2rem; 
        }

        .reports-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 1.5rem; 
        }
        
        .report-card { 
            background: var(--bg-secondary); 
            padding: 1.5rem; 
            border-radius: 20px; 
            border: 1px solid var(--border-color); 
            text-align: center;
        }

        /* Viewer */
        .viewer { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: #000; 
            z-index: 9999; 
        }
        
        .viewer-header { 
            height: 60px; 
            background: #141927; 
            display: flex; 
            align-items: center; 
            padding: 0 20px; 
            justify-content: space-between; 
        }

        .spinner {
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            width: 12px; height: 12px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-left: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div class="login-container" id="loginView">
        <div class="login-box">
            <h2 class="gradient-text" style="margin-bottom: 2rem;">Portal GTC</h2>
            <form id="loginForm">
                <input type="text" id="username" class="form-input" placeholder="Usuario" required>
                <input type="password" id="password" class="form-input" placeholder="Contraseña" required>
                <button type="submit" id="loginBtn" class="btn btn-primary">Entrar al Portal</button>
                <div id="loginError" class="error-message"></div>
            </form>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardView" class="dashboard">
        <div class="header">
            <h2 class="gradient-text">Bienvenido, <span id="displayUser"></span></h2>
            <button class="btn" style="background: #2d3548; color: white;" onclick="logout()">Cerrar Sesión</button>
        </div>
        <div id="reportGrid" class="reports-grid"></div>
    </div>

    <!-- VISOR -->
    <div id="viewerView" class="viewer">
        <div class="viewer-header">
            <h3 id="reportTitle" style="color: white;">Cargando...</h3>
            <button class="btn" style="background: #ff4d4d; color: white;" onclick="closeReport()">Cerrar</button>
        </div>
        <div id="reportFrameContainer" style="width:100%; height:calc(100% - 60px);"></div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby-LAt1-k7VCsjfaa6eOXwUvNLm5ZT7FkxGLPCsDzSL9LfdVVoOq1j5RJ3Oo6j8pnW_/exec'; 

        let currentUser = null;
        let sessionToken = null;

        // Inicialización
        window.onload = () => {
            document.getElementById('loginForm').onsubmit = handleLogin;
        };

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('loginError');
            
            btn.disabled = true;
            btn.innerHTML = 'Validando... <div class="spinner"></div>';
            errorMsg.classList.remove('show');

            try {
                const user = document.getElementById('username').value;
                const pass = document.getElementById('password').value;

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', username: user, password: pass })
                });
                const result = await response.json();

                if (result.success) {
                    currentUser = result.data.username;
                    sessionToken = result.data.token;
                    document.getElementById('displayUser').textContent = currentUser;
                    document.getElementById('loginView').style.display = 'none';
                    document.getElementById('dashboardView').classList.add('active');
                    loadReports();
                } else {
                    errorMsg.textContent = result.message;
                    errorMsg.classList.add('show');
                    btn.disabled = false;
                    btn.textContent = 'Entrar al Portal';
                }
            } catch (err) {
                errorMsg.textContent = "Error de conexión.";
                errorMsg.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Entrar al Portal';
            }
        }

        async function loadReports() {
            const grid = document.getElementById('reportGrid');
            grid.innerHTML = '<p>Cargando informes...</p>';
            
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getReports', username: currentUser, token: sessionToken })
                });
                const result = await response.json();

                if (result.success) {
                    grid.innerHTML = '';
                    result.data.reports.forEach(report => {
                        const card = document.createElement('div');
                        card.className = 'report-card';
                        card.innerHTML = `
                            <h3 style="margin-bottom:1rem">${report.name}</h3>
                            <button class="btn btn-primary" onclick="openReport('${report.payload}', '${report.name}')">Ver Informe</button>
                        `;
                        grid.appendChild(card);
                    });
                }
            } catch (err) {
                grid.innerHTML = '<p>Error al cargar reportes.</p>';
            }
        }

        function openReport(payload, name) {
            document.getElementById('reportTitle').textContent = name;
            const container = document.getElementById('reportFrameContainer');
            container.innerHTML = '';
            
            const shadow = container.attachShadow({mode: 'closed'});
            const iframe = document.createElement('iframe');
            iframe.src = atob(payload); 
            iframe.style.width = "100%"; iframe.style.height = "100%"; iframe.style.border = "none";
            
            shadow.appendChild(iframe);
            document.getElementById('viewerView').style.display = 'block';
        }

        function closeReport() {
            document.getElementById('viewerView').style.display = 'none';
            document.getElementById('reportFrameContainer').innerHTML = '';
        }

        function logout() { location.reload(); }
    </script>
</body>
</html>
