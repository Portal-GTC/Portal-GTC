<script>
    // 1. CONFIGURACIÓN ÚNICA
    const SCRIPT_URL = 'TU_URL_DE_APPS_SCRIPT_AQUI/exec'; 

    let currentUser = null;
    let sessionToken = null;

    // 2. REFERENCIAS AL DOM (Asegúrate de que existan en tu HTML)
    const loginView = document.querySelector('.login-container');
    const dashboardView = document.getElementById('dashboardView');
    const viewerView = document.getElementById('viewerView');
    const reportGrid = document.getElementById('reportGrid');

    // 3. INICIALIZACIÓN (Esto evita la pantalla blanca)
    window.onload = () => {
        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', handleLogin);
        } else {
            console.error("No se encontró el elemento 'loginForm'");
        }
    };

    // 4. FUNCIÓN DE LOGIN
    async function handleLogin(e) {
        if(e) e.preventDefault();
        
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('loginError');

        btn.disabled = true;
        btn.innerHTML = 'Accediendo... <div class="spinner"></div>';
        errorMsg.classList.remove('show');

        try {
            // Usamos 'no-cors' no es opción aquí porque necesitamos el JSON, 
            // pero Google requiere manejar la redirección manualmente a veces.
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'cors', // Forzar CORS
                body: JSON.stringify({ action: 'login', username: user, password: pass })
            });
            
            const result = await response.json();

            if (result.success) {
                currentUser = result.data.username;
                sessionToken = result.data.token;
                document.getElementById('displayUser').textContent = currentUser;
                
                loginView.style.display = 'none';
                dashboardView.classList.add('active');
                loadReports();
            } else {
                errorMsg.textContent = result.message;
                errorMsg.classList.add('show');
            }
        } catch (err) {
            console.error("Error detallado:", err);
            errorMsg.textContent = "Error de conexión con Google Apps Script.";
            errorMsg.classList.add('show');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Entrar al Portal';
        }
    }

    // 5. CARGAR REPORTES
    async function loadReports() {
        reportGrid.innerHTML = '<p>Consultando informes...</p>';
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'cors',
                body: JSON.stringify({ 
                    action: 'getReports', 
                    username: currentUser, 
                    token: sessionToken 
                })
            });
            const result = await response.json();

            if (result.success) {
                renderReports(result.data.reports);
            }
        } catch (err) {
            reportGrid.innerHTML = '<p>Error al cargar la lista.</p>';
        }
    }

    function renderReports(reports) {
        reportGrid.innerHTML = '';
        if (!reports || reports.length === 0) {
            reportGrid.innerHTML = '<p>No tienes reportes asignados.</p>';
            return;
        }

        reports.forEach(report => {
            const card = document.createElement('div');
            card.className = 'report-card';
            card.innerHTML = `
                <h3 style="margin-bottom:1.5rem">${report.name}</h3>
                <button class="btn btn-primary" onclick="openReport('${report.payload}', '${report.name}')">
                    Abrir Informe
                </button>
            `;
            reportGrid.appendChild(card);
        });
    }

    function openReport(payload, name) {
        document.getElementById('reportTitle').textContent = name;
        const container = document.getElementById('reportFrameContainer');
        container.innerHTML = '';
        
        const shadow = container.attachShadow({mode: 'closed'});
        const iframe = document.createElement('iframe');
        
        try {
            iframe.src = atob(payload); 
            iframe.style.width = "100%";
            iframe.style.height = "100%";
            iframe.style.border = "none";
            iframe.setAttribute('referrerpolicy', 'no-referrer');
            
            shadow.appendChild(iframe);
            viewerView.style.display = 'block';
        } catch (e) {
            alert("Error al abrir reporte.");
        }
    }

    function closeReport() {
        viewerView.style.display = 'none';
        document.getElementById('reportFrameContainer').innerHTML = '';
    }

    function logout() {
        location.reload();
    }
</script>
