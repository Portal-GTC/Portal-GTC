<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Grupo Termo Control</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #141927;
            --accent-primary: #00d4ff;
            --accent-secondary: #7c3aed;
            --text-primary: #e8edf4;
            --text-secondary: #9ca3af;
            --border-color: #2d3548;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Outfit', sans-serif; 
            background: var(--bg-primary); 
            color: var(--text-primary); 
            min-height: 100vh; 
            overflow-x: hidden; 
        }

        .gradient-text {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text; 
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .login-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
        .login-box { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 24px; padding: 3rem; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        .form-input { width: 100%; padding: 12px; margin: 10px 0; background: #1e2535; border: 1px solid var(--border-color); border-radius: 10px; color: white; outline: none; font-family: inherit; }
        .form-input:focus { border-color: var(--accent-primary); }

        .spinner { border: 3px solid var(--border-color); border-top: 3px solid var(--accent-primary); border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; margin-left: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .dashboard { display: none; padding: 2rem; max-width: 1200px; margin: 0 auto; }
        .dashboard.active { display: block; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
        .reports-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        
        .report-card { background: var(--bg-secondary); padding: 1.5rem; border-radius: 20px; border: 1px solid var(--border-color); transition: 0.3s; }
        .report-card:hover { border-color: var(--accent-primary); transform: translateY(-5px); }

        .btn { padding: 12px 24px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; text-decoration: none; font-family: inherit; }
        .btn-primary { background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); color: white; width: 100%; }
        .btn-logout { background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); }

        .viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; overflow: hidden; }
        .viewer-header { height: 60px; background: #141927; display: flex; align-items: center; padding: 0 20px; justify-content: space-between; }
        .error-message { color: #ff4d4d; font-size: 0.9rem; margin-top: 10px; display: none; }
        .error-message.show { display: block; }
    </style>
</head>
<body>
    <div id="loginView" class="login-container">
        <div class="login-box">
            <h2 class="gradient-text" style="margin-bottom: 1.5rem; font-size: 1.8rem;">Portal GTC</h2>
            <form id="loginForm">
                <input type="text" id="username" class="form-input" placeholder="Usuario" required>
                <input type="password" id="password" class="form-input" placeholder="Contraseña" required>
                <button type="submit" id="loginBtn" class="btn btn-primary">Entrar al Portal</button>
            </form>
            <div id="loginError" class="error-message"></div>
        </div>
    </div>

    <div id="dashboardView" class="dashboard">
        <div class="header">
            <h2 class="gradient-text">Bienvenido, <span id="displayUser"></span></h2>
            <button class="btn btn-logout" onclick="logout()">Cerrar Sesión</button>
        </div>
        <div id="reportGrid" class="reports-grid"></div>
    </div>

    <div id="viewerView" class="viewer">
        <div class="viewer-header">
            <h2 id="reportTitle" class="gradient-text" style="font-size: 1.2rem;"></h2>
            <button class="btn" style="background:transparent; border:1px solid var(--accent-primary); color:var(--accent-primary);" onclick="closeReport()">Volver</button>
        </div>
        <div id="safeReportContainer" style="width: 100%; height: calc(100% - 60px);"></div>
    </div>

    <script>
        // REEMPLAZA ESTA URL CON LA TUYA DE GOOGLE APPS SCRIPT
        const SCRIPT_URL = 'TU_URL_DE_APPS_SCRIPT_AQUI/exec'; 
        let currentUser = null;

        window.onload = () => {
            document.getElementById('loginForm').onsubmit = handleLogin;
        };

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('loginError');
            btn.disabled = true;
            btn.innerHTML = 'Validando... <div class="spinner"></div>';
            err.classList.remove('show');

            try {
                const user = document.getElementById('username').value;
                const pass = document.getElementById('password').value;
                const resp = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({action: 'login', username: user, password: pass})
                });
                const res = await resp.json();
                if(res.success) {
                    currentUser = res.data.username;
                    document.getElementById('displayUser').textContent = currentUser;
                    document.getElementById('loginView').style.display = 'none';
                    document.getElementById('dashboardView').classList.add('active');
                    loadReports();
                } else {
                    err.textContent = res.message;
                    err.classList.add('show');
                }
            } catch(e) { 
                err.textContent = "Error de conexión con el servidor."; 
                err.classList.add('show'); 
            } finally {
                btn.disabled = false;
                btn.textContent = 'Entrar al Portal';
            }
        }

        async function loadReports() {
            const grid = document.getElementById('reportGrid');
            grid.innerHTML = '<p>Cargando reportes...</p>';
            try {
                const resp = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({action: 'getReports', username: currentUser})
                });
                const res = await resp.json();
                if(res.success) {
                    grid.innerHTML = '';
                    res.data.reports.forEach(report => {
                        const card = document.createElement('div');
                        card.className = 'report-card';
                        card.innerHTML = `
                            <h3 style="margin-bottom:1.5rem">${report.name}</h3>
                            <button class="btn btn-primary" onclick="openReport('${report.payload}', '${report.name}')">Ver Reporte</button>
                        `;
                        grid.appendChild(card);
                    });
                }
            } catch(e) { grid.innerHTML = '<p>Error al cargar reportes.</p>'; }
        }

        function openReport(payload, name) {
            document.getElementById('reportTitle').textContent = name;
            const container = document.getElementById('safeReportContainer');
            container.innerHTML = '';
            
            const shadow = container.attachShadow({mode: 'closed'});
            const iframe = document.createElement('iframe');
            iframe.src = atob(payload); 
            iframe.style.width = "100%"; iframe.style.height = "100%"; iframe.style.border = "none";
            iframe.setAttribute('referrerpolicy', 'no-referrer');
            
            shadow.appendChild(iframe);
            document.getElementById('viewerView').style.display = 'block';
        }

        function closeReport() { document.getElementById('viewerView').style.display = 'none'; }
        function logout() { location.reload(); }
    </script>
</body>
</html>
