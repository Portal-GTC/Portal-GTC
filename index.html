<script>
    // URL de tu Web App de Google Apps Script (Debe terminar en /exec)
    const SCRIPT_URL = 'TU_URL_DE_APPS_SCRIPT'; 

    let currentUser = null;
    let sessionToken = null;

    // Referencias
    const loginView = document.querySelector('.login-container');
    const dashboardView = document.getElementById('dashboardView');
    const viewerView = document.getElementById('viewerView');
    const reportGrid = document.getElementById('reportGrid');

    // Función de Login
    async function handleLogin(e) {
        if(e) e.preventDefault();
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('loginError');

        btn.disabled = true;
        btn.innerHTML = 'Accediendo... <div class="spinner"></div>';
        errorMsg.classList.remove('show');

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'login', username: user, password: pass })
            });
            const result = await response.json();

            if (result.success) {
                currentUser = result.data.username;
                sessionToken = result.data.token;
                document.getElementById('displayUser').textContent = currentUser;
                
                loginView.style.display = 'none';
                dashboardView.classList.add('active');
                loadReports();
            } else {
                errorMsg.textContent = result.message;
                errorMsg.classList.add('show');
            }
        } catch (err) {
            errorMsg.textContent = "Error de conexión.";
            errorMsg.classList.add('show');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Entrar al Portal';
        }
    }

    // Cargar reportes desde el backend
    async function loadReports() {
        reportGrid.innerHTML = '<p>Consultando informes...</p>';
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: 'getReports', 
                    username: currentUser, 
                    token: sessionToken 
                })
            });
            const result = await response.json();

            if (result.success) {
                renderReports(result.data.reports);
            }
        } catch (err) {
            reportGrid.innerHTML = '<p>Error al cargar la lista.</p>';
        }
    }

    function renderReports(reports) {
        reportGrid.innerHTML = '';
        if (reports.length === 0) {
            reportGrid.innerHTML = '<p>No tienes reportes asignados.</p>';
            return;
        }

        reports.forEach(report => {
            const card = document.createElement('div');
            card.className = 'report-card';
            // IMPORTANTE: report.payload es la URL en Base64 que viene del Apps Script
            card.innerHTML = `
                <h3 style="margin-bottom:1.5rem">${report.name}</h3>
                <button class="btn btn-primary" onclick="openReport('${report.payload}', '${report.name}')">
                    Abrir Informe
                </button>
            `;
            reportGrid.appendChild(card);
        });
    }

    // Abrir reporte con técnica de ocultación
    function openReport(payload, name) {
        document.getElementById('reportTitle').textContent = name;
        const container = document.getElementById('reportFrameContainer');
        
        // Limpiar contenido previo
        container.innerHTML = '';
        
        // Crear Shadow DOM cerrado (No aparece en el inspector de elementos normal)
        const shadow = container.attachShadow({mode: 'closed'});
        
        const iframe = document.createElement('iframe');
        try {
            // Decodifica la URL de Power BI al vuelo
            iframe.src = atob(payload); 
            iframe.style.width = "100%";
            iframe.style.height = "100%";
            iframe.style.border = "none";
            iframe.setAttribute('referrerpolicy', 'no-referrer');
            // Sandbox para restringir acciones del iframe
            iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms');
            
            shadow.appendChild(iframe);
            viewerView.style.display = 'block';
        } catch (e) {
            alert("Error al decodificar el enlace del reporte.");
        }
    }

    function closeReport() {
        viewerView.style.display = 'none';
        document.getElementById('reportFrameContainer').innerHTML = '';
    }

    function logout() {
        location.reload(); // Forma más limpia de resetear todo el estado
    }
</script>
